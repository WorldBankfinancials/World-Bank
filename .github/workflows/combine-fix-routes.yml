name: Combine fix-routes parts

on:
  workflow_dispatch:
  push:
    branches:
      - deep-scan-27-fixes

jobs:
  combine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deep-scan-27-fixes
          fetch-depth: 0

      - name: Combine parts and push
        run: |
          if [ ! -f server/fix-routes-part1.ts ]; then
            echo "Parts already combined, skipping"
            exit 0
          fi
          cat server/fix-routes-part1.ts server/fix-routes-part2.ts server/fix-routes-part3.ts server/fix-routes-part4.ts > server/fix-routes.ts
          rm -f server/fix-routes-part1.ts server/fix-routes-part2.ts server/fix-routes-part3.ts server/fix-routes-part4.ts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Combine fix-routes parts into single file with 18 bug fixes"
          git push
