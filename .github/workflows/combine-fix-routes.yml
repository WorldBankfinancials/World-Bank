name: Combine fix-routes parts

on:
  push:
    branches:
      - deep-scan-27-fixes

jobs:
  combine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deep-scan-27-fixes
          fetch-depth: 0

      - name: Combine parts
        run: |
          if [ -f server/fix-routes-part1.ts ] && [ -f server/fix-routes-part2.ts ] && [ -f server/fix-routes-part3.ts ] && [ -f server/fix-routes-part4.ts ]; then
            cat server/fix-routes-part1.ts server/fix-routes-part2.ts server/fix-routes-part3.ts server/fix-routes-part4.ts > server/fix-routes.ts
            rm -f server/fix-routes-part1.ts server/fix-routes-part2.ts server/fix-routes-part3.ts server/fix-routes-part4.ts
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Combine fix-routes parts into single file with 18 bug fixes"
            git push
          else
            echo "Parts not found, skipping"
          fi
